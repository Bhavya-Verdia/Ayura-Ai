name: Ayura AI Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy touches the droplet at a time. Without this, pushes in quick
# succession each start a run, and two runs doing `docker compose rm -fs` and
# `up -d` against the same host collide: Docker renames the loser's container
# (`<hash>_ayura_api`), the next run hits "container name is already in use",
# and the site can be left with nothing running. Queued, not cancelled — an
# in-flight deploy that is mid-restart must finish rather than be killed
# halfway.
#
# NOTE this cannot see `./deploy.sh` run from a laptop. Running that while a
# push-triggered deploy is in flight is the same collision, and is what took
# production down on 2026-08-14. Use one path or the other, not both.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Single deploy method, mirroring deploy.sh: sync source to the droplet and build
# the images from source there (docker-compose.yml uses `build:`, not prebuilt
# images — the previous GHCR pull approach could never match it, and it also
# targeted the wrong path /opt/ayura instead of /opt/ayuraai).
#
# Requires one repo secret: DEPLOY_SSH_KEY = the private SSH key for the droplet.
# Host/dir are not secret (already committed in deploy.sh).
env:
  DEPLOY_HOST: 64.227.191.87
  REMOTE_DIR: /opt/ayuraai

jobs:
  # ─────────────────────────────────────────────────────────────────
  # 1. CI gates — deploy only runs if these pass
  # ─────────────────────────────────────────────────────────────────
  ci-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run backend tests
        run: python -m pytest --tb=short -q

  ci-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ─────────────────────────────────────────────────────────────────
  # 2. Deploy: rsync source → droplet, build + restart there
  # ─────────────────────────────────────────────────────────────────
  deploy:
    needs: [ci-backend, ci-frontend]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync source to server
        # No --delete, and .env is never in the CI checkout, so the droplet keeps
        # its own runtime state (.env, server/uploads, seeded server/data/chromadb).
        run: |
          rsync -az \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='**/.env' \
            --exclude='client/node_modules' \
            --exclude='server/venv' \
            --exclude='server/data/chromadb' \
            --exclude='**/__pycache__' \
            --exclude='*.pyc' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            ./ "root@$DEPLOY_HOST:$REMOTE_DIR/"

      - name: Build & restart on server
        # GIT_SHA is baked into the api/worker images and returned by /api/health,
        # so a backend deploy can be verified from outside instead of being taken on
        # trust. `.git` is excluded from the rsync above, so the droplet cannot work
        # the commit out for itself — it has to be handed over.
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "root@$DEPLOY_HOST" \
            "cd $REMOTE_DIR \
             && export GIT_SHA=${{ github.sha }} \
             && docker compose build api web worker \
             && docker compose up -d --force-recreate api web worker \
             && sleep 10 \
             && curl --fail http://localhost:8000/api/health"

      - name: Verify the deployed commit is this one
        # The workflow's own success line is not evidence — CLAUDE.md is explicit
        # about that, and it is explicit because a deploy has silently left the site
        # serving an older image before. This asks the running container what it is.
        run: |
          served=$(ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new "root@$DEPLOY_HOST" \
            "curl -s http://localhost:8000/api/health" | python3 -c "import json,sys; print(json.load(sys.stdin).get('git_sha',''))")
          echo "served git_sha: $served"
          echo "expected      : ${{ github.sha }}"
          if [ "$served" != "${{ github.sha }}" ]; then
            echo "::error::/api/health reports $served, not ${{ github.sha }} — the running container is not this build"
            exit 1
          fi
