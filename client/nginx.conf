server {
    listen 80;
    server_name ayuraai.in www.ayuraai.in;
    return 301 https://ayuraai.in$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.ayuraai.in;
    ssl_certificate     /etc/letsencrypt/live/ayuraai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayuraai.in/privkey.pem;
    return 301 https://ayuraai.in$request_uri;
}

server {
    listen 443 ssl;
    # HTTP/1.1 caps a browser at six connections per host, and the landing page
    # requests 20+ files at once (Lighthouse: "24 requests not served via HTTP/2").
    http2 on;
    server_name ayuraai.in;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/ayuraai.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ayuraai.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # ── Gzip compression ──────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ── Security headers ──────────────────────────────────────────
    # Also included in every location below that has its own add_header —
    # see security-headers.conf for why.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Landing page — pre-rendered HTML, short public cache ──────
    location = / {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=60" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # ── Pre-rendered public SEO page — flat file so /dosha-test (no trailing
    #    slash) is served directly, matching its canonical/sitemap URL ─────────
    location = /dosha-test {
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=60" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /dosha-test.html /app.html;
    }

    # ── SPA fallback is /app.html, NOT /index.html ────────────────
    #
    # index.html is the pre-rendered snapshot of `/` (69 kB of landing-page
    # DOM). Serving it as the catch-all made every other route paint the full
    # marketing homepage before React booted and threw it away — measured at
    # ~0.9-1.3s of visibly wrong page on a throttled phone, followed by a
    # spinner, then the real screen.
    #
    # app.html (written by scripts/prerender.mjs) is the pristine shell: same
    # <head>, empty #root, 4.6 kB, and without the landing chunk/CSS preloads
    # the snapshot had picked up. Routes that are NOT pre-rendered must use it.

    # ── Pre-rendered sign-in pages. Exact matches win over the regex below;
    #    main.jsx adopts the snapshot only for a browser never signed in ──────
    location = /login {
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /login.html /app.html;
    }
    location = /register {
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /register.html /app.html;
    }

    # ── Pre-rendered legal pages, the other two URLs in the sitemap ──
    location = /privacy {
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /privacy.html /app.html;
    }
    location = /terms {
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /terms.html /app.html;
    }

    # ── Auth / public pages — short cache, revalidate on revisit ──
    location ~* ^/(login|register|forgot-password|reset-password) {
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /app.html;
    }

    # ── Authenticated app routes — never cache HTML ───────────────
    # The routes App.jsx declares, and nothing else: every other path used to
    # get the shell with a 200, so a crawler indexed any typo as a page.
    # server/tests/test_nginx_spa_routes.py holds this list to App.jsx.
    location ~ ^/(dashboard|progress|remedies|timeline|checkin|chat|settings|community|dosha-quiz|notifications|reminders|interaction-check|onboarding|admin|verify-email|auth/google/callback|auth/github/callback)(/|$) {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /app.html =404;
    }

    # ── Files in dist, else a real 404 that still boots the app ──
    # error_page without `=` keeps the 404 status; the shell renders NotFound.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
        error_page 404 /app.html;
    }

    # ── API proxy ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, never append. $proxy_add_x_forwarded_for appends to the
        # client-supplied header, and the app reads the list to identify the
        # caller — so appending let anyone rotate a fake leading entry and get a
        # fresh rate-limit bucket per request. This container terminates TLS on
        # :443 directly (no proxy in front), so $remote_addr *is* the real peer.
        # If a CDN/LB is ever put in front, switch this back to
        # $proxy_add_x_forwarded_for AND raise TRUSTED_PROXY_HOPS to match.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Uploads proxy ─────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://api:8000;
    }

    # ── Service worker — must revalidate on every update check ────
    # The assets regex below would give sw.js a 1-year immutable cache;
    # a long-cached service worker can pin clients to a dead build on
    # browsers/proxies that honor it (exact match beats the regex).
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /sw.js =404;
    }

    # ── Static assets — immutable long cache ─────────────────────
    location ~* \.(js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }
}
