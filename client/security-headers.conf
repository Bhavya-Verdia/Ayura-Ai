# Security headers, included at server level AND in every location that has an
# add_header of its own. nginx inherits add_header from the enclosing block
# only when a block sets none, so a location adding Cache-Control silently
# dropped all four of these: /, /dosha-test, the auth pages and every app route
# were served with no CSP and no HSTS. server/tests/test_nginx_security_headers.py
# fails if a location with add_header does not include this file.
#
# CSP, beyond 'self':
#   script-src *.posthog.com   PostHog loads its config and survey scripts from
#                              eu-assets.i.posthog.com (lib/analytics.js)
#   'unsafe-inline' (script)   the theme bootstrap in index.html, which must run
#                              before first paint
#   'unsafe-inline' (style)    style attributes (framer-motion) and the
#                              stylesheets inlined into the prerendered pages
#   font-src data:             Vite inlines font subsets under 4 kB into the CSS
#                              as data: URLs; blocked, those glyphs fell back
#   img-src blob:              avatar and tongue-photo previews (createObjectURL)
#   img-src https:             OAuth avatars (Google, GitHub)
#   worker-src blob:           Sentry Replay's compression worker
#   connect-src https:         Sentry and PostHog ingestion
#
# Referrer-Policy: an app URL can carry a reset or verification token in its
# query string, so another origin gets the origin and nothing more.
# Permissions-Policy: the app uses none of these. Web push asks through the
# Notification API, which this header does not govern, and the tongue photo is
# a file input, not the camera API.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https: wss: ws:; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
